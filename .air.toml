root = "."
tmp_dir = "tmp"
env_files = []

[build]
cmd = "go build -o ./tmp/main ./cmd/server"
entrypoint = ["./tmp/main"]
include_ext = ["go", "sql"]
include_file = ["go.mod", "go.sum"]
exclude_dir = ["tmp", ".git", "vendor", "frontend"]
stop_on_error = true
send_interrupt = true
kill_delay = "10s"
poll = true
poll_interval = 500
delay = 200

services:
  app:
    image: golang:1.27.0
    working_dir: /app
    environment:
      GOTOOLCHAIN: local
      HTTP_ADDR: ${HTTP_ADDR-:8080}
      DATABASE_URL: ${DATABASE_URL-postgres://gateway:gateway-local-only@postgres:5432/gateway?sslmode=disable}
      BROWSER_ORIGIN: ${BROWSER_ORIGIN-http://127.0.0.1:5173}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT-5s}
    stop_grace_period: ${APP_STOP_GRACE_PERIOD:-15s}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - go-tmp:/app/tmp
      - frontend-build:/app/frontend/dist:ro
    ports:
      - "127.0.0.1:8080:8080"
    command: ["go", "tool", "air"]

  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway-local-only
      POSTGRES_DB: gateway
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 15

  dbmate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    profiles: ["tools"]
    environment:
      DATABASE_URL: ${DATABASE_URL-postgres://gateway:gateway-local-only@postgres:5432/gateway?sslmode=disable}
    volumes:
      - ./db:/db
    command: ["--no-dump-schema", "migrate", "--strict"]

  sqlc:
    image: sqlc/sqlc:1.31.1
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - .:/src
    command: ["generate"]

  frontend:
    image: oven/bun:1.4.2
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-deps:/app/node_modules
      - frontend-build:/app/dist
      - bun-cache:/root/.bun/install/cache
    ports:
      - "127.0.0.1:5173:5173"
    command: ["sh", "-c", "bun install --frozen-lockfile && exec bun run dev"]

volumes:
  postgres-data:
  go-mod:
  go-build:
  go-tmp:
  frontend-deps:
  frontend-build:
  bun-cache:

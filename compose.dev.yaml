services:
  app:
    build: !reset null
    image: golang:1.27.0
    entrypoint: []
    user: "65532:65532"
    working_dir: /app
    environment:
      GOTOOLCHAIN: local
      GOCACHE: /cache/go-build
      HOME: /tmp
      HTTP_ADDR: ${HTTP_ADDR-:8080}
      BROWSER_ORIGIN: ${BROWSER_ORIGIN-http://localhost:5173}
    # Vite serves the frontend without a compiled build in development.
    healthcheck: !reset {}
    volumes:
      - .:/app
      - go-mod:/go/pkg/mod
      - go-build:/cache/go-build
      - go-tmp:/app/tmp
      - frontend-build:/app/frontend/dist:ro
    command: ["go", "tool", "air"]

  storage-init:
    volumes:
      - go-mod:/go/pkg/mod
      - go-build:/cache/go-build
      - go-tmp:/worktmp
    command: ["sh", "-c", "chown 65532:65532 /data /key-material && chmod 700 /data /key-material && chown -R 65532:65532 /go/pkg/mod /cache/go-build /worktmp"]

  sqlc:
    image: sqlc/sqlc:1.31.1
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - .:/src
    command: ["generate"]

  frontend:
    image: oven/bun:1.4.2
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-deps:/app/node_modules
      - frontend-build:/app/dist
      - bun-cache:/root/.bun/install/cache
    ports:
      - "127.0.0.1:5173:5173"
    command: ["sh", "-c", "bun install --frozen-lockfile && exec bun run dev"]

volumes:
  go-mod:
  go-build:
  go-tmp:
  frontend-deps:
  frontend-build:
  bun-cache:

services:
  app:
    build: .
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL-postgres://gateway:gateway-local-only@postgres:5432/gateway?sslmode=disable}
      BROWSER_ORIGIN: ${BROWSER_ORIGIN-http://127.0.0.1:8080}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT-5s}
    stop_grace_period: ${APP_STOP_GRACE_PERIOD:-15s}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/readyz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway-local-only
      POSTGRES_DB: gateway
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 15

  dbmate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    profiles: ["tools"]
    environment:
      DATABASE_URL: ${DATABASE_URL-postgres://gateway:gateway-local-only@postgres:5432/gateway?sslmode=disable}
    volumes:
      - ./db:/db
    command: ["--no-dump-schema", "migrate", "--strict"]

volumes:
  postgres-data:

services:
  app:
    build: .
    environment:
      HTTP_ADDR: :8080
      DATABASE_PATH: ${DATABASE_PATH-/data/gateway.db}
      ENCRYPTION_KEY_PATH: ${ENCRYPTION_KEY_PATH-/key-material/application.key}
      BROWSER_ORIGIN: ${BROWSER_ORIGIN-http://localhost:8080}
      SESSION_LIFETIME: ${SESSION_LIFETIME-12h}
      CHALLENGE_LIFETIME: ${CHALLENGE_LIFETIME-5m}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT-5s}
    stop_grace_period: ${APP_STOP_GRACE_PERIOD:-15s}
    depends_on:
      storage-init:
        condition: service_completed_successfully
    volumes:
      - sqlite-data:/data
      - encryption-key:/key-material
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/readyz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  storage-init:
    image: alpine:3.23.0
    user: "0:0"
    volumes:
      - sqlite-data:/data
      - encryption-key:/key-material
    command: ["sh", "-c", "chown 65532:65532 /data /key-material && chmod 700 /data /key-material"]

  dbmate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    profiles: ["tools"]
    user: "65532:65532"
    environment:
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DATABASE_URL: sqlite:${DATABASE_PATH-/data/gateway.db}
    volumes:
      - ./db/migrations:/db/migrations:ro
      - sqlite-data:/data
    command: ["--no-dump-schema", "migrate", "--strict"]

volumes:
  sqlite-data:
  encryption-key:
